<!-- @ui:component progress -->
<!-- @ui:kind primitive -->
<!-- @ui:slots track fill label -->

<!-- Default — data-value on the root sets the fill: no style attribute, so a
     server template can render it. A style="width: 60%" on the fill still
     works (and wins). -->
<div data-ui="progress" data-variant="default" role="progressbar" aria-label="Progress" data-value="60" aria-valuenow="60" aria-valuemin="0" aria-valuemax="100">
  <div data-part="track">
    <div data-part="fill"></div>
  </div>
  <span data-part="label">60%</span>
</div>

<!-- With variant -->
<div data-ui="progress" data-variant="success" role="progressbar" aria-label="Progress" data-value="100" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100">
  <div data-part="track">
    <div data-part="fill"></div>
  </div>
  <span data-part="label">100%</span>
</div>

<!-- Small destructive -->
<div data-ui="progress" data-size="sm" data-variant="destructive" role="progressbar" aria-label="Progress" data-value="40" aria-valuenow="40" aria-valuemin="0" aria-valuemax="100">
  <div data-part="track">
    <div data-part="fill"></div>
  </div>
  <span data-part="label">40%</span>
</div>

<!-- Large -->
<div data-ui="progress" data-size="lg" data-variant="warning" role="progressbar" aria-label="Progress" data-value="75" aria-valuenow="75" aria-valuemin="0" aria-valuemax="100">
  <div data-part="track">
    <div data-part="fill"></div>
  </div>
  <span data-part="label">75%</span>
</div>
