<!--
  Testimonials — a wall of quotes, composition only, zero JavaScript.
    · The section is labelled by its own heading (aria-labelledby), so the
      landmark carries a name without inventing one.
    · Every quote is the quote primitive in its card variant, wrapped in a real
      list item: assistive technology announces "list, 6 items", and the quote
      keeps its own contract (figure, blockquote, figcaption, an optional
      rating before the text and an avatar inside the author). The item WRAPS
      the quote rather than being it — a nested component never carries a
      data-part of its own.
    · Three layouts from one markup: a grid of equal rows, packed columns for
      quotes of different lengths, and a marquee that stacks two strips moving
      against each other. The strips are the marquee primitive, written the
      marquee's way (two identical tracks, the second aria-hidden); each card
      sits in [data-part="slide"], the pattern's own wrapper, which is where
      its width is set.
    · data-animate plays the reveal primitive's stagger on the items. A reveal
      cannot wrap the list — it staggers its direct children and the list is
      this pattern's part — so the entrance is an option of the pattern itself,
      reading the same --motion-reveal-* and --motion-stagger tokens.
-->
