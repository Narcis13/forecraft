# deploy/contzo/app.conf: how deploy.sh ships this project to the WSL host.
# Sourced by bash, so it is shell syntax: no spaces around '=', quote values.
# Committed to git; never put secrets here (they belong in ~/apps/forecraft/shared/.env).

APP_NAME="forecraft"              # ~/apps/forecraft, unit name, Caddy site file name
SUBDOMAIN="forecraft"             # -> https://forecraft.contzo.lol
KIND="service"

# ---- service ---------------------------------------------------------------
PORT=7713                         # the app binds 127.0.0.1:$PORT (src/server.ts reads PORT and HOST)
HEALTH_PATH="/health"             # SELECT 1 against the SQLite database
# Node 24 runs the TypeScript entry directly, as `npm start` does.
PROCESSES=(
  "web|node src/server.ts"
)
SSE=0
MAX_BODY="10MiB"                  # assets are capped at 1 MiB by the app; definitions are JSON
# data/forecraft.db (the app's default path, ../data from src/) lives in shared/.
SHARED_DIRS=("data")

BACKUP="sqlite:data/forecraft.db"
SYNC_EXCLUDES=("/test-results/" "/playwright-report/" "/.faqir/" "/.claude/" "/docs/screenshots/")

# ---- hooks ---------------------------------------------------------------------
# No prune: the form preview runs the Faqir audit from faqir-ui-cli, a devDependency.
app_build() {         # cwd: ~/apps/forecraft/src
  node_build
  # PDFs render in headless Chromium; playwright-core pins its revision and keeps it in
  # ~/.cache/ms-playwright. A no-op once that revision is there.
  node node_modules/playwright-core/cli.js install --only-shell chromium
}
app_env() {           # extra lines for the FIRST shared/.env (never rewritten later)
  echo "TRUST_PROXY=1"            # Caddy in front: believe X-Forwarded-For / X-Forwarded-Proto
}
